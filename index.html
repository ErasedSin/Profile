<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaio Moreira - Portfolio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Verdana', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .background {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .welcome {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s ease-in-out;
            text-align: center;
            -webkit-text-stroke: 1px rgba(165, 123, 196, 1);
            text-stroke: 1px rgba(165, 123, 196, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .topics {
            position: absolute;
            top: 30%;
            left: 5%;
            color: #FFD700; /* Yellow */
            font-size: 1.8em;
        }

        .topic {
            cursor: pointer;
            margin: 10px 0;
            transition: color 0.3s;
            -webkit-text-stroke: 1px black;
        }

        .topic:hover {
            color: #A3C6E8;
        }

        .info-box, .about-me {
            display: none;
            position: absolute;
            top: 40%;
            right: 10%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            width: 40%;
            text-align: center;
            animation: slideIn 1s ease-in-out;
            z-index: 1;
        }

        @keyframes slideIn {
            from { transform: translate(50%, -50%); opacity: 0; }
            to { transform: translate(0, -50%); opacity: 1; }
        }

        h2 {
            margin-top: 0;
            color: #FFD700; /* Yellow */
        }

        p {
            color: #FFD700; /* Yellow */
        }

        #toggle-music {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 2em;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
            text-shadow: 1px 1px 2px black;
        }

        .about-me img {
            width: 100px; /* Adjust image size as needed */
            border-radius: 50%; /* Makes the image round */
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <video autoplay muted loop class="background">
        <source src="video/Huston Skyline by LennSan.webm" type="video/webm">        
    </video>

    <div class="welcome" id="welcome" data-en="Welcome to my Portfolio!" data-pt="Bem-vindo ao meu Portfólio!">Welcome to my Portfolio!</div>

    <div class="topics">
        <div class="topic" onclick="showInfo('skills')" data-en="Skills" data-pt="Habilidades">Skills</div>
        <div class="topic" onclick="showInfo('projects')" data-en="Projects" data-pt="Projetos">Projects</div>
        <div class="topic" onclick="showInfo('contact')" data-en="Contact" data-pt="Contato">Contact</div>
        <div class="topic" onclick="showInfo('education')" data-en="Education" data-pt="Formação">Education</div>
        <div class="topic" onclick="showInfo('competencies')" data-en="Competencies" data-pt="Competências">Competencies</div>
        <div class="topic" onclick="showInfo('courses')" data-en="Courses" data-pt="Cursos">Courses</div>
        <div class="topic" onclick="showInfo('hobbies')" data-en="Hobbies" data-pt="Hobbies">Hobbies</div>
        <div class="topic" onclick="showInfo('goals')" data-en="Goals" data-pt="Metas">Goals</div>
        <div class="topic" onclick="showInfo('about-me')" data-en="About Me" data-pt="Sobre Mim">About Me</div>
    </div>

    <div id="skills" class="info-box">
        <h2 data-en="Skills" data-pt="Habilidades">Skills</h2>
        <p data-en="Java (Intermediate)" data-pt="Java (Intermediário)">Java (Intermediate)</p>
        <p data-en="JavaScript (Advanced)" data-pt="JavaScript (Avançado)">JavaScript (Advanced)</p>
        <p data-en="Responsive website development" data-pt="Desenvolvimento de sites responsivos">Responsive website development</p>
        <p data-en="Database design" data-pt="Design de bancos de dados">Database design</p>
    </div>

    <div id="projects" class="info-box">
        <h2 data-en="Projects" data-pt="Projetos">Projects</h2>
        <p data-en="DOM Fut - E-commerce" data-pt="DOM Fut - E-commerce">DOM Fut - E-commerce</p>
        <p data-en="Sorting Algorithms Simulator" data-pt="Simulador de Algoritmos de Ordenação">Sorting Algorithms Simulator</p>
    </div>

    <div id="contact" class="info-box">
        <h2 data-en="Contact" data-pt="Contato">Contact</h2>
        <p><a href="https://linkedin.com/in/gmoreira777" target="_blank" data-en="LinkedIn" data-pt="LinkedIn">LinkedIn</a></p>
        <p><a href="https://github.com/ErasedSin" target="_blank" data-en="GitHub" data-pt="GitHub">GitHub</a></p>
        <p><a href="https://mail.google.com/mail/?view=cm&fs=1&to=gaiomoreira199@gmail.com" data-en="Email" data-pt="Email">Email</a></p>
    </div>

    <!-- Additional sections with proper data attributes -->

    <button id="toggle-music">🎵</button>

    <audio id="background-music" loop>
        <source src="music/lofi.ogg" type="audio/ogg">
        <source src="music/lofi.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <script>
        const music = document.getElementById('background-music');
        const toggleButton = document.getElementById('toggle-music');

        music.volume = 0.2; // Set music volume

        toggleButton.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                toggleButton.textContent = '🎵';
            } else {
                music.pause();
                toggleButton.textContent = '🎵';
            }
        });

        // Auto-play music when the page loads
        music.play().catch(error => {
            console.log('Error trying to play music:', error);
        });

        function showInfo(topic) {
            const boxes = document.querySelectorAll('.info-box, .about-me');
            boxes.forEach(box => {
                box.style.display = 'none';
            });
            document.getElementById(topic).style.display = 'block';
        }

        // Language toggle logic
        function toggleLanguage(lang) {
            document.querySelectorAll('[data-en]').forEach(el => {
                el.textContent = el.getAttribute(`data-${lang}`);
            });

            // Update placeholders for inputs and links if needed
            document.querySelectorAll('input[data-en], textarea[data-en], a[data-en]').forEach(el => {
                if (el.placeholder) {
                    el.placeholder = el.getAttribute(`data-${lang}`);
                } else if (el.href) {
                    el.textContent = el.getAttribute(`data-${lang}`);
                }
            });
        }
    </script>

    <div style="position: absolute; top: 5%; right: 5%;">
        <button onclick="toggleLanguage('en')">English</button>
        <button onclick="toggleLanguage('pt')">Português</button>
    </div>
</body>
</html>
